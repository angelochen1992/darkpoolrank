const DATES = window.DPM_DATES || D.dates;
const TOP = D.boards[0], FIXED = D.boards.slice(1);

// ---- 颜色：全部由脚本开头的 BG_COLOR / SHADES 推出 ----
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgb2hex = a => '#' + a.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const x = hex2rgb(a), y = hex2rgb(b); return rgb2hex(x.map((v, i) => v + (y[i] - v) * t)); };
const lum = h => { const [r, g, b] = hex2rgb(h); return (0.299*r + 0.587*g + 0.114*b) / 255; };
const DARK = '#1f2a17', LIGHT = '#ffffff', BORDER = '#000000';
const textOn = h => lum(h) > 0.55 ? DARK : LIGHT;       // 深色方块用白字，浅色方块用深字

const BG = D.colors.bg, SHADES = D.colors.shades;       // SHADES：深 → 浅
const TXT = textOn(BG), MUTED = mix(TXT, BG, 0.45);
const PANEL = mix(BG, '#000000', 0.06), GROUP_BG = mix(BG, '#000000', 0.12), NO_SIG = BG;
const css = document.documentElement.style;
css.setProperty('--bg', BG);     css.setProperty('--panel', PANEL);
css.setProperty('--text', TXT);  css.setProperty('--muted', MUTED);
css.setProperty('--accent', SHADES[0]);

function shade(t){
  const seg = Math.min(Math.max(t, 0), 1) * (SHADES.length - 1);
  const i = Math.min(SHADES.length - 2, Math.floor(seg));
  return mix(SHADES[i], SHADES[i + 1], seg - i);
}

// ---- 工具 ----
const DOLLAR_STEPS = [5, 10, 20, 30, 50, 100, 200, 500];   // 百万美元
const DESC = {};
D.boards.forEach(b => b.groups.forEach(g => g.items.forEach(i => DESC[i.t] = i.d)));
function money(x){
  if (x >= 1e9) return '$' + (x/1e9).toFixed(2) + 'B';
  if (x >= 1e6) return '$' + (x/1e6).toFixed(1) + 'M';
  return '$' + Math.round(x).toLocaleString();
}
const f2 = x => x == null ? '-' : x.toFixed(2);
const rankText = s => s.best_r == null ? 'R 未上榜' : 'R' + s.best_r;
const tileText = s => `${rankText(s)}<br>${money(s.dollars)}`;
function hoverOf(t, s){
  const d = DESC[t] ? ' · ' + DESC[t] : '';
  return `<b>${t}</b>${d}<br>${s.sector}${s.industry ? ' · ' + s.industry : ''}` +
    `<br>成交额: ${money(s.dollars)}<br>笔数: ${s.n} (Dark ${s.dark} / Lit ${s.lit})` +
    `<br>大单均价: ${f2(s.vwap)} · 现价: ${f2(s.current)}` +
    `<br>最佳 R: ${s.best_r ?? '未上榜'} · RS: ${f2(s.max_rs)}`;
}
const boardH = b => {
  const n = b.groups.reduce((a, g) => a + g.items.length, 0);
  return Math.max(240, Math.min(560, 120 + n * 28));
};
// 主标题（加粗）+ 副标题（小 20%，不加粗）；副标题里 [[...]] 的部分放大 20%
const titleHtml = (main, sub) =>
  `<span class="t">${main}</span>` +
  (sub ? `<span class="sub">${sub.replace(/\[\[(.+?)\]\]/g, '<span class="hi">$1</span>')}</span>` : '');

// ---- Trace 构建 ----
const newTrace = () => ({ids:[], labels:[], parents:[], values:[], colors:[], tc:[], lw:[], texts:[], hovers:[], sig:[]});
function add(T, o){
  T.ids.push(o.id); T.labels.push(o.label); T.parents.push(o.parent); T.values.push(o.value);
  T.colors.push(o.color || SHADES[0]); T.tc.push(o.tc || TXT); T.texts.push(o.text || '');
  T.hovers.push(o.hover || ''); T.lw.push(o.hl ? 3.5 : 1.5); T.sig.push(!!o.sig);
}
// 按方块大小着色：同一板块（或整张看板）内越大越深
function shadeTrace(T){
  const groups = {};
  T.sig.forEach((s, i) => { if (!s) return;
    const k = D.colorScope === 'board' ? '_all' : T.parents[i];
    (groups[k] = groups[k] || []).push(i); });
  Object.values(groups).forEach(idx => {
    idx.sort((a, b) => T.values[b] - T.values[a]);
    idx.forEach((i, r) => {
      const c = shade(idx.length > 1 ? r / (idx.length - 1) : 0);
      T.colors[i] = c; T.tc[i] = textOn(c);
    });
  });
  return T;
}

function buildBoard(b, bi){
  const T = newTrace();
  b.groups.forEach((g, gi) => {
    let parent = '';
    if (g.name){
      parent = `b${bi}g${gi}`;
      add(T, {id: parent, label: g.name, parent: '', value: 0, color: GROUP_BG, hover: `<b>${g.name}</b>`});
    }
    g.items.forEach(it => {
      const s = D.tickers[it.t], id = `b${bi}g${gi}/${it.t}`;
      if (!s){
        add(T, {id, label: it.t, parent, value: 1, color: NO_SIG, tc: MUTED, text: '无信号',
                hover: `<b>${it.t}</b> · ${it.d}<br>今日无大单信号`});
        return;
      }
      add(T, {id, label: it.t, parent, value: 1 + Math.log10(1 + s.dollars/1e6),
              text: tileText(s), hover: hoverOf(it.t, s), sig: true});
    });
  });
  return shadeTrace(T);
}

function buildRanked(mode, th){
  let list = Object.entries(D.tickers).map(([t, s]) => ({t, s}));
  list = mode === 'rank'
    ? list.filter(x => x.s.best_r != null && x.s.best_r <= th).sort((a, b) => a.s.best_r - b.s.best_r)
    : list.filter(x => x.s.dollars >= th * 1e6).sort((a, b) => b.s.dollars - a.s.dollars);
  const T = newTrace(), secs = new Set();
  list.forEach(({t, s}) => {
    const sid = 'S:' + s.sector;
    if (!secs.has(sid)){ secs.add(sid);
      add(T, {id: sid, label: s.sector, parent: '', value: 0, color: GROUP_BG, hover: `<b>${s.sector}</b>`}); }
    const w = t in DESC;      // 属于固定看板的标的：加 ★ 和粗黑框
    const v = mode === 'rank' ? Math.max(1, 51 - s.best_r) : Math.sqrt(s.dollars / 1e6);
    add(T, {id: sid + '/' + t, label: (w ? '★ ' : '') + t, parent: sid, value: v,
            text: tileText(s), hover: hoverOf(t, s), sig: true, hl: w});
  });
  return shadeTrace(T);
}

function draw(div, T){
  Plotly.react(div, [{
    type: 'treemap', ids: T.ids, labels: T.labels, parents: T.parents, values: T.values,
    branchvalues: 'remainder', text: T.texts, customdata: T.hovers,
    marker: {colors: T.colors, line: {color: BORDER, width: T.lw}},
    texttemplate: '<b>%{label}</b><br>%{text}',
    hovertemplate: '%{customdata}<extra></extra>',
    textfont: {color: T.tc, size: 14}, textposition: 'middle center',
    pathbar: {visible: false}, tiling: {pad: 3}, root: {color: BG}
  }], {
    margin: {t: 0, l: 0, r: 0, b: 0}, paper_bgcolor: BG,
    font: {family: '-apple-system, PingFang SC, Helvetica, Arial', color: TXT},
    hoverlabel: {bgcolor: '#ffffff', bordercolor: BORDER, font: {color: DARK}}
  }, {displaylogo: false, responsive: true}).then(() => Plotly.Plots.resize(div));
}

// ---- 只重画最上面的地图 ----
function render(){
  const mode = document.querySelector('input[name=mode]:checked').value;
  const rv = +document.getElementById('rank').value;
  const dv = DOLLAR_STEPS[+document.getElementById('dollar').value];
  document.getElementById('rankVal').textContent = rv;
  document.getElementById('dollarVal').textContent = '$' + dv + 'M';
  document.getElementById('rankBox').style.display = mode === 'rank' ? '' : 'none';
  document.getElementById('dollarBox').style.display = mode === 'dollar' ? '' : 'none';

  const tl = mode === 'macro'
    ? {main: TOP.title, sub: TOP.subtitle}
    : {main: mode === 'rank' ? `按 Rank 选择（R ≤ ${rv}）` : `按资金量选择（成交额 ≥ $${dv}M）`, sub: ''};
  document.getElementById('topTitle').innerHTML = titleHtml(tl.main, tl.sub);

  const top = document.getElementById('top'), empty = document.getElementById('empty');
  const T = mode === 'macro' ? buildBoard(TOP, 0) : buildRanked(mode, mode === 'rank' ? rv : dv);
  const isEmpty = T.ids.length === 0;
  empty.style.display = isEmpty ? '' : 'none';
  top.style.display = isEmpty ? 'none' : '';
  if (!isEmpty){
    top.style.height = (mode === 'macro' ? boardH(TOP) : 680) + 'px';
    draw('top', T);
  }
  history.replaceState(null, '', '#' + mode + (mode === 'rank' ? '=' + rv : mode === 'dollar' ? '=' + dv : ''));
}

(function init(){
  document.getElementById('sub').textContent = D.day;
  document.getElementById('meta').textContent = `数据源：${D.source}`;

  // 固定看板：只画一次，切换模式时不变
  document.getElementById('fixedBoards').innerHTML = FIXED.map((b, i) =>
    `<section class="board"><h2>${titleHtml(b.title, b.subtitle)}</h2>` +
    `<div id="fb${i}" style="height:${boardH(b)}px"></div></section>`
  ).join('');
  FIXED.forEach((b, i) => draw('fb' + i, buildBoard(b, i + 1)));

  const hist = document.getElementById('hist');
  hist.innerHTML = DATES.map(d => `<option value="${d}" ${d === D.day ? 'selected' : ''}>${d}</option>`).join('');
  hist.onchange = () => location.href = hist.value + '.html' + location.hash;

  // 从 URL hash 恢复模式，例如 #rank=20 / #dollar=50
  const m = location.hash.slice(1).match(/^(macro|rank|dollar)(?:=(\d+))?$/);
  if (m){
    document.querySelector(`input[value=${m[1]}]`).checked = true;
    if (m[1] === 'rank' && m[2]) document.getElementById('rank').value = m[2];
    if (m[1] === 'dollar' && m[2]){
      const i = DOLLAR_STEPS.indexOf(+m[2]);
      if (i >= 0) document.getElementById('dollar').value = i;
    }
  }
  document.querySelectorAll('input[name=mode]').forEach(e => e.onchange = render);
  document.getElementById('rank').oninput = render;
  document.getElementById('dollar').oninput = render;
  render();
})();
</script>
